  <main class="contact-page container">
    <div class="contact-map-wrap">
      <iframe class="contact-map" title="Карта центра Москвы — временное расположение офиса" src="https://www.openstreetmap.org/export/embed.html?bbox=37.6078%2C55.7495%2C37.6278%2C55.7621&amp;layer=mapnik&amp;marker=55.7558%2C37.6173" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
    </div>
    <section class="contact-content" aria-labelledby="contact-title">
      <h1 id="contact-title">Contact us</h1>
      <p class="contact-intro">Lorem ipsum likus Karison Alexandra Sjoberg i Signe Bjork, Michael Jansson.</p>
      <form class="contact-form" action="#" method="post">
        <label class="contact-field"><span class="contact-field__icon" aria-hidden="true">✓</span><span class="contact-field__copy"><span class="contact-field__label">Full Name</span><input type="text" name="name" placeholder="Write here..." autocomplete="name" required></span></label>
        <label class="contact-field"><span class="contact-field__icon" aria-hidden="true">✓</span><span class="contact-field__copy"><span class="contact-field__label">Email Address</span><input type="email" name="email" placeholder="Write here..." autocomplete="email" required></span></label>
        <label class="contact-field contact-field--message"><span class="visually-hidden">Message</span><textarea name="message" placeholder="Message&#10;Write here..." rows="5" required></textarea></label>
        <label class="contact-consent"><input type="checkbox" name="privacy" required><span>Keep me up to date on news and events</span></label>
        <button class="button button--accent contact-submit" type="submit">Send message</button>
      </form>
    </section>
  </main>
